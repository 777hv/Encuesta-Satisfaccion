name: Deploy

# Despliega a Azure App Service en cada push a main (o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Si un test falla, no se despliega.
      - run: dotnet test Encuestas.slnx

      - name: Compilar React
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Publicar API con React dentro de wwwroot
        run: |
          dotnet publish src/Encuestas.Api -c Release -o publish
          mkdir -p publish/wwwroot
          cp -r frontend/dist/. publish/wwwroot/

      - uses: azure/webapps-deploy@v3
        with:
          app-name: encuestas-777
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
